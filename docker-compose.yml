# Local database of the site (DC Scaffold: https://github.com/Djason16/dc-scaffold), started by start.bat -> D
#   MySQL       localhost:3306
#   phpMyAdmin  http://localhost:8081 (user root)
# Values read from the .env of the site (start.bat passes it to Docker; by hand: docker compose --env-file frontend/.env up -d):
#   DB_PASS = password of root (the user of the site), DB_NAME = the database, DB_PORT = the port of MySQL
# Data kept in ./database (not sent to Git). Online, the site uses the MySQL database of the host instead.
name: djason-cv

services:
  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: djason-cv-db
    volumes:
      - ./database:/var/lib/mysql
      - ./mysql/logs:/var/lib/mysql-logs
      # SQL files here run once, when ./database is empty
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME:-djason_cv}
      TZ: Europe/Paris
    command: ['mysqld', '--default-time-zone=Europe/Paris']
    healthcheck:
      # TCP (127.0.0.1), not the socket: on the first start MySQL runs a temporary server without network
      # to create the database, and the socket would answer before the real server is ready
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      timeout: 20s
      retries: 10
      interval: 5s
      start_period: 30s
    networks:
      - djason-cv-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '2G'

  phpmyadmin:
    image: phpmyadmin
    container_name: djason-cv-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 200M
      TZ: Europe/Paris
    ports:
      - '8081:80'
    networks:
      - djason-cv-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

networks:
  djason-cv-network:
    driver: bridge
